{% extends "djangoapp/base.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" type="text/css" href="{% static 'css/password_changes.css' %}" />

<div class="password-change-container">
    <h3 class="text-center">Change Your Password</h3>

    {% if form.errors %}
        <div class="alert alert-danger alert-dismissible" role="alert">
            {% for key, value in form.errors.items %}
                <strong>{{ value }}</strong>
            {% endfor %}
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
    {% endif %}

    <div class="card">
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_old_password">Old Password</label>
                <input type="password" name="old_password" autocomplete="new-password" class="form-control" required id="id_old_password" placeholder="Enter Old Password"/>
            </div>

            <div class="form-group">
                <label for="id_new_password1">New Password</label>
                <input type="password" name="new_password1" autocomplete="new-password" class="form-control" required id="id_new_password1" placeholder="Enter New Password"/>
            </div>

            <div class="form-group">
                <label for="id_new_password2">New Password Confirmation</label>
                <input type="password" name="new_password2" autocomplete="new-password" required id="id_new_password2" class="form-control" placeholder="Confirm New Password"/>
            </div>

            <button type="submit" class="btn btn-dark btn-block">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
