{% extends "djangoapp/base.html" %}
{% block title %} Policy {% endblock%}
{% load static %}
{% block content%}
<link rel="stylesheet" href="{% static 'css/policy.css' %}">

<div class = "container">
    <h1>{{ policy.name }}</h1>
    <p><strong>Policy of:</strong> 
        <a href="{% url 'profile_page' policy.official.user.id %}">
        {{ policy.official.user.first_name }} {{ policy.official.user.last_name }}
        </a>
    </p>
    <p>{{ policy.desc }}</p>
</div>
{% endblock %}
