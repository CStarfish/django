{% extends "djangoapp/base.html" %}
{% block title %} Profile Page {% endblock title%}
{% load static %}
{% block content %}
<div>
    <h2>Register</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
    <div class="login-redirect">
        <a href="{% url 'login' %}" class="register_button">Back to login</a>
    </div>
</div>
{% endblock %}
