{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static '/css/styles.css' %}">
</head>
<body>
    <header>
        <div class="logo">Voting Guide</div>
        <nav>
            <ul>
                <li><a href="#">About</a></li>
                <li><a href="#">Profile</a></li>
                <li class="login"><a href="{% url 'login' %}">Log In / Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="intro">
            <h1>Welcome to Voting Guide</h1>
            <p>Find and evaluate information about political candidates and voting processes easily.</p>
        </section>
        <section class="search">
            <!-- Search button logic -->
            <form method="GET" action="{% url 'results' %}">
                {{ form.search }}
                <div class="filters">
                    <h3>Filter By:</h3>
                    {{ form.filter1 }}
                </div>
                <button type="submit" value="OK">Search</button>
            </form>
        </section>
    </main>
    <footer>
        <ul>
            <li><a href="#">Terms of Service</a></li>
            <li><a href="#">Privacy Policy</a></li>
        </ul>
    </footer>
    <script>    // Function to log search criteria for political candidates
        function searchCandidates() {
            let query = document.getElementById("searchBar").value;
            let location = document.getElementById("location").value;
            let party = document.getElementById("party").value;
            let experience = document.getElementById("experience").value;
            let topics = document.getElementById("topics").value;

            console.log("Searching for:", query, location, party, experience, topics);
        }
    </script>
</body>
